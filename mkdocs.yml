site_name: vndb-client
repo_url: https://github.com/HOZHENWAI/vndb-client
site_url: https://HOZHENWAI.github.io/vndb-client
site_description: Http based Vndb Client.
site_author: Olivier HO
edit_uri: edit/main/docs/
repo_name: HOZHENWAI/vndb-client
copyright: Maintained by <a href="https://HOZHENWAI.com">HOZHENWAI</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/vndb_client"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HOZHENWAI/vndb-client
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vndb-client

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
