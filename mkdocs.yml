site_name: vndb-client
repo_url: https://github.com/Game-fan-hoarder/vndb-client
site_url: https://game-fan-hoarder.github.io/vndb-client
site_description: Http based Vndb Client.
site_author: HOZHENWAI
edit_uri: edit/main/docs/
repo_name: Game-fan-hoarder/vndb-client
copyright: Maintained by <a href="https://github.com/Game-fan-hoarder">HOZHENWAI</a>.

# Keep internal design docs / feature maps / plans out of the published site.
exclude_docs: |
  2026-*.md
  superpowers/

nav:
  - Home: index.md
  - Guides:
      - Getting started: guides/getting-started.md
      - Authentication: guides/authentication.md
      - Querying: guides/querying.md
      - Filtering: guides/filtering.md
      - Entities: guides/entities.md
      - User lists: guides/user-lists.md
      - Error handling: guides/error-handling.md
  - API Reference:
      - Client: reference/client.md
      - Models & resources: reference/models.md
      - Entities: reference/entities.md
      - Filters: reference/filters.md
      - GET endpoints: reference/meta.md
      - Configuration: reference/config.md
      - Exceptions: reference/exceptions.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/vndb_client"]
          options:
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: false
            show_source: false
            filters: ["!^_"]
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Game-fan-hoarder/vndb-client
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vndb-client

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
